<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Pitch Competition - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Startup Pitch Competition</h1>
    <p>Register below to pitch your idea</p>
  </header>

  <section class="form-section">
    <form id="regForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name">
      <span class="error" id="nameError"></span>

      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <span class="error" id="emailError"></span>

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone">
      <span class="error" id="phoneError"></span>

      <label for="teamName">Team Name</label>
      <input type="text" id="teamName" name="teamName">
      <span class="error" id="teamNameError"></span>

      <label for="idea">Your Idea</label>
      <textarea id="idea" name="idea" rows="4"></textarea>
      <span class="error" id="ideaError"></span>

      <button type="submit">Register</button>
    </form>

    <div id="successMsg" class="success-msg">
      Registration successful! We'll contact you soon.
    </div>
</section>
</body>
</html>
