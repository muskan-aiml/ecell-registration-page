<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Pitch Competition - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Startup Pitch Competition</h1>
    <p>Register below to pitch your idea</p>
  </header>

  <section class="form-section">
    <form id="regForm" action="#success">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required minlength="2">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required pattern="[6-9][0-9]{9}" title="Enter a valid 10-digit phone number">

      <label for="teamName">Team Name</label>
      <input type="text" id="teamName" name="teamName" required>

      <label for="idea">Your Idea</label>
      <textarea id="idea" name="idea" rows="4" required minlength="20"></textarea>

      <button type="submit">Register</button>
    </form>
  </section>

  <div id="success" class="success-msg">
    Registration successful! We'll contact you soon.
  </div>

</body>
</html>
